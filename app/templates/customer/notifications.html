{% extends "customer/base_customer.html" %}

{% block title %}Notifications | {{ restaurant.name if restaurant else 'The Royal Feast' }}{% endblock %}

{% block customer_content %}
<div style="padding: 16px 16px 100px;">

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="{{ url_for('customer.home') }}" style="font-size: 1.2rem; color: var(--text-main);"><i class="bi bi-arrow-left"></i></a>
      <h2 style="font-size: 1.2rem; font-weight: 800;">Notifications</h2>
    </div>
    <button class="btn-sm btn-outline" onclick="markAllRead()">Mark all as read</button>
  </div>

  <div id="notif-list-container">
    <div style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
      <div class="status-dot" style="margin: 0 auto 10px;"></div>
      Loading notifications...
    </div>
  </div>

</div>
{% endblock %}

{% block extra_scripts %}
{{ super() }}
<script>
async function loadNotifications() {
  const container = document.getElementById('notif-list-container');
  const browserId = localStorage.getItem('rf_browser_session_id');
  if (!browserId) {
    container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted);">No notifications yet.</div>`;
    return;
  }

  try {
    const res = await fetch(`/api/notifications?browser_session_id=${browserId}`);
    const data = await res.json();

    if (!data.notifications || data.notifications.length === 0) {
      container.innerHTML = `
        <div style="text-align: center; padding: 60px 20px;">
          <div style="width: 70px; height: 70px; border-radius: 50%; background: #F1F5F9; color: #94A3B8; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 12px;">
            <i class="bi bi-bell-slash"></i>
          </div>
          <h3 style="font-size: 1.05rem; font-weight: 700;">No Notifications Yet</h3>
          <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Updates on your orders and payments will appear here.</p>
        </div>
      `;
      return;
    }

    let html = '';
    data.notifications.forEach(n => {
      let icon = 'bi-bell-fill';
      let iconColor = '#2563EB';
      let bg = '#EFF6FF';

      if (n.type.includes('placed') || n.type.includes('confirmed')) {
        icon = 'bi-clipboard-check-fill';
        iconColor = '#2563EB';
        bg = '#EFF6FF';
      } else if (n.type.includes('preparing') || n.type.includes('kitchen')) {
        icon = 'bi-fire';
        iconColor = '#D97706';
        bg = '#FEF3C7';
      } else if (n.type.includes('ready') || n.type.includes('served')) {
        icon = 'bi-check-circle-fill';
        iconColor = '#16A34A';
        bg = '#DCFCE7';
      } else if (n.type.includes('payment')) {
        icon = 'bi-cash-coin';
        iconColor = '#059669';
        bg = '#D1FAE5';
      }

      const dateStr = n.created_at ? new Date(n.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

      html += `
        <div style="background: ${n.is_read ? '#FFFFFF' : '#FFFBEB'}; border-radius: var(--radius-md); border: 1px solid var(--light-border); padding: 14px; margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start; box-shadow: var(--shadow-sm);">
          <div style="width: 40px; height: 40px; border-radius: 50%; background: ${bg}; color: ${iconColor}; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;">
            <i class="bi ${icon}"></i>
          </div>
          <div style="flex: 1;">
            <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px;">
              <h4 style="font-size: 0.9rem; font-weight: 700; color: var(--text-main);">${n.title}</h4>
              <span style="font-size: 0.7rem; color: var(--text-light);">${dateStr}</span>
            </div>
            <p style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">${n.message}</p>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div style="text-align: center; color: red;">Failed to load notifications.</div>`;
  }
}

async function markAllRead() {
  const browserId = localStorage.getItem('rf_browser_session_id');
  if (!browserId) return;

  await fetch('/api/notifications/read', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ browser_session_id: browserId })
  });

  loadNotifications();
}

document.addEventListener('DOMContentLoaded', loadNotifications);
</script>
{% endblock %}
