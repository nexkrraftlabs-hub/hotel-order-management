{% extends "customer/base_customer.html" %}

{% block title %}Live Order Tracking | {{ restaurant.name if restaurant else 'The Royal Feast' }}{% endblock %}

{% block customer_content %}
<div style="padding: 16px 16px 100px;">

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--text-main);">Live Order Status</h2>
    <button class="btn-sm btn-outline" onclick="loadCustomerOrders()" title="Refresh Status">
      <i class="bi bi-arrow-clockwise"></i> Refresh
    </button>
  </div>

  <div id="orders-container">
    <!-- Rendered dynamically -->
    <div style="text-align: center; padding: 40px 20px;">
      <div class="status-dot" style="width: 12px; height: 12px; margin: 0 auto 12px;"></div>
      <p style="font-size: 0.88rem; color: var(--text-muted);">Fetching your orders...</p>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_scripts %}
{{ super() }}
<script>
const STATUS_STAGES = [
  { key: 'pending', label: 'Order Placed', desc: 'Order received by restaurant', icon: 'bi-check-circle' },
  { key: 'preparing', label: 'Food Preparing', desc: 'Admin approved & kitchen is preparing', icon: 'bi-fire' },
  { key: 'served', label: 'Served to You', desc: 'Bon Appétit! Enjoy your meal', icon: 'bi-check2-all' },
  { key: 'paid', label: 'Payment Completed', desc: 'Payment approved & final bill generated', icon: 'bi-cash-coin' }
];

function getCustomerStageKey(status) {
  if (['confirmed', 'sent_to_kitchen', 'kitchen_accepted', 'preparing', 'ready', 'transferred_to_waiter', 'serving'].includes(status)) {
    return 'preparing';
  }
  if (['payment_pending', 'paid', 'completed'].includes(status)) {
    return 'paid';
  }
  return status;
}

async function loadCustomerOrders() {
  const container = document.getElementById('orders-container');
  const browserId = localStorage.getItem('rf_browser_session_id');

  if (!browserId) {
    showNoOrders(container);
    return;
  }

  try {
    const res = await fetch(`/api/orders?browser_session_id=${browserId}`);
    const data = await res.json();

    if (!data.orders || data.orders.length === 0) {
      showNoOrders(container);
      return;
    }

    let tokenHtml = '';
    if (data.token) {
      tokenHtml = `
        <div class="token-hero-badge">
          <div style="font-size: 0.8rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px;">
            YOUR ASSIGNED ORDER TOKEN
          </div>
          <div class="token-large-number">#${String(data.token).padStart(2, '0')}</div>
          <div class="token-status-pill">
            <span class="status-dot" style="margin-right: 6px;"></span>
            ${data.session_status === 'completed' ? 'Session Completed' : 'Active Dining Session'}
          </div>
          <p style="font-size: 0.75rem; color: #94A3B8; margin-top: 8px;">
            Food will be served at your token spot.
          </p>
        </div>
      `;
    }

    let ordersHtml = '';
    data.orders.forEach((order, idx) => {
      // Find current stage index mapped to customer process
      const activeStageKey = getCustomerStageKey(order.status);
      const stageIdx = STATUS_STAGES.findIndex(s => s.key === activeStageKey);
      const isPaid = order.payment_status === 'paid' || order.status === 'paid' || order.status === 'completed';

      let timelineHtml = '';
      STATUS_STAGES.forEach((stage, sIdx) => {
        let stepClass = '';
        if (isPaid || sIdx < stageIdx) {
          stepClass = 'completed';
        } else if (sIdx === stageIdx) {
          stepClass = 'active';
        }

        timelineHtml += `
          <div class="timeline-step ${stepClass}">
            <div class="step-indicator">
              <i class="bi ${stage.icon}"></i>
            </div>
            <div class="step-content">
              <h4>${stage.label}</h4>
              <p>${stage.desc}</p>
            </div>
          </div>
        `;
      });

      let itemsSummary = order.items.map(it => `${it.quantity}x ${it.item_name}`).join(', ');

      let badgeClass = 'confirmed';
      let displayStatus = 'Order Placed';
      if (order.status === 'served') {
        badgeClass = 'served';
        displayStatus = 'Served';
      } else if (isPaid) {
        badgeClass = 'paid';
        displayStatus = 'Paid';
      } else if (order.status === 'cancelled') {
        badgeClass = 'cancelled';
        displayStatus = 'Cancelled';
      } else if (['preparing', 'confirmed', 'sent_to_kitchen', 'kitchen_accepted', 'ready', 'transferred_to_waiter', 'serving'].includes(order.status)) {
        badgeClass = 'cooking';
        displayStatus = 'Preparing';
      } else if (order.status === 'pending') {
        badgeClass = 'pending';
        displayStatus = 'Pending Approval';
      }

      ordersHtml += `
        <div style="background: #FFFFFF; border-radius: var(--radius-lg); border: 1px solid var(--light-border); box-shadow: var(--shadow-sm); padding: 18px; margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--light-border); padding-bottom: 12px; margin-bottom: 14px;">
            <div>
              <span style="font-size: 0.72rem; color: var(--text-muted); font-weight: 700;">ORDER #${idx + 1}</span>
              <div style="font-weight: 800; font-size: 0.95rem; color: var(--text-main);">${order.order_id}</div>
            </div>
            <div style="text-align: right;">
              <span class="badge badge-${badgeClass}">
                ${displayStatus}
              </span>
              <div style="font-size: 0.9rem; font-weight: 800; color: var(--text-main); margin-top: 3px;">₹${order.total_amount}</div>
            </div>
          </div>

          <div style="background: #F8FAFC; border-radius: var(--radius-md); padding: 10px 12px; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px;">
            <strong style="color: var(--text-main);">Items:</strong> ${itemsSummary}
          </div>

          <!-- Vertical Timeline -->
          <div class="timeline">
            ${timelineHtml}
          </div>
        </div>
      `;
    });

    const isSessionPaid = data.session_status === 'completed' || (data.orders.length > 0 && data.orders.every(o => o.payment_status === 'paid' || o.status === 'paid' || o.status === 'completed'));
    const hasBill = data.has_bill || isSessionPaid;
    const actionButtons = `
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px;">
        ${!isSessionPaid ? `
          <a href="{{ url_for('customer.menu') }}" class="btn-primary-block" style="text-decoration: none; background: #0F172A;">
            <i class="bi bi-plus-circle"></i> Add More Food (Same Token)
          </a>
        ` : ''}
        ${hasBill && data.session_id ? `
          <a href="/bill/${data.session_id}" class="btn-primary-block" style="text-decoration: none; background: var(--veg-color);">
            <i class="bi bi-receipt"></i> View Digital Bill
          </a>
        ` : `
          <div style="text-align: center; padding: 12px 16px; font-size: 0.8rem; color: var(--text-muted); background: #F8FAFC; border-radius: var(--radius-md); border: 1px dashed var(--light-border);">
            <i class="bi bi-info-circle"></i> Digital Bill will be available once payment is approved by Admin.
          </div>
        `}
      </div>
    `;

    container.innerHTML = tokenHtml + ordersHtml + actionButtons;

  } catch (err) {
    console.error('Failed to load customer orders:', err);
    container.innerHTML = `<div style="text-align: center; color: red;">Failed to load order tracking.</div>`;
  }
}

function showNoOrders(container) {
  container.innerHTML = `
    <div style="text-align: center; padding: 60px 20px;">
      <div style="width: 80px; height: 80px; border-radius: 50%; background: #EFF6FF; color: #2563EB; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 16px;">
        <i class="bi bi-clock-history"></i>
      </div>
      <h3 style="font-size: 1.15rem; font-weight: 800; margin-bottom: 6px;">No Active Orders</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px;">Scan the QR code at your spot, order dishes, and track them here in real-time!</p>
      <a href="{{ url_for('customer.menu') }}" class="btn-primary-block" style="text-decoration: none;">
        <i class="bi bi-menu-button-wide"></i> Browse Menu
      </a>
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', () => {
  loadCustomerOrders();
  // Poll every 5 seconds for live status
  setInterval(loadCustomerOrders, 5000);
});
</script>
{% endblock %}
