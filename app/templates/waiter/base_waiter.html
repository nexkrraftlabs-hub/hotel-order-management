{% extends "base.html" %}

{% block body %}
<div style="min-height: 100vh; background: #0F172A; color: #FFFFFF; display: flex; flex-direction: column;">

  <!-- Waiter Header -->
  <header style="background: #1E293B; border-bottom: 1px solid #334155; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 40px; height: 40px; border-radius: var(--radius-md); background: #6366F1; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #fff;">
        <i class="bi bi-person-walking"></i>
      </div>
      <div>
        <h2 style="font-size: 1.15rem; font-weight: 800; color: #FFFFFF; line-height: 1.2;">Waiter Service Portal</h2>
        <span style="font-size: 0.75rem; color: #94A3B8;">Captain: {{ current_user.full_name }}</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px;">
      <div id="waiter-clock" style="font-size: 0.95rem; font-weight: 800; color: #FCD34D;">--:--:--</div>
      <button class="btn-sm btn-outline" style="color: #fff; border-color: #475569;" onclick="App.playChime('warning'); App.showToast('Bell tested', 'info');">
        <i class="bi bi-bell-fill"></i> Sound
      </button>
      <a href="{{ url_for('auth.logout') }}" class="btn-sm btn-outline" style="color: #EF4444; border-color: #EF4444;">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>
    </div>
  </header>

  <!-- Main View -->
  <main style="flex: 1; padding: 20px;">
    {% block waiter_content %}{% endblock %}
  </main>

</div>
{% endblock %}

{% block extra_scripts %}
<script>
setInterval(() => {
  const el = document.getElementById('waiter-clock');
  if (el) el.textContent = new Date().toLocaleTimeString();
}, 1000);

document.addEventListener('DOMContentLoaded', () => {
  if (window.App) {
    const socket = App.initSocket('waiter');
    if (socket) {
      socket.on('order_update', (data) => {
        if (data.status === 'ready' || data.status === 'transferred_to_waiter') {
          App.playChime('warning');
          App.showToast('🍽️ Food is ready for pickup from kitchen!', 'warning');
        }
        if (typeof reloadWaiterOrders === 'function') reloadWaiterOrders();
      });
    }
  }
});
</script>
{% endblock %}
