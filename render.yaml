services:
  - type: web
    name: the-royal-feast
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn -k gthread -w 1 --threads 100 run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: APP_BASE_URL
        value: https://hotel-order-management-zdnb.onrender.com/

